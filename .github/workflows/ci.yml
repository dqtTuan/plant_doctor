# CI: lint + test + build thử image CPU và smoke test container.
# Chạy cho mọi Pull Request và mỗi lần push (trừ khi chỉ sửa tài liệu/notebook).
name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["**.md", "notebooks/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Test chỉ phụ thuộc thư viện chuẩn -> không cần cài torch/ultralytics (CI nhanh)
      - name: Install tools
        run: pip install ruff pytest

      - name: Ruff
        run: ruff check .




      - name: Pytest
        run: pytest -q

      - name: Hadolint (Dockerfile)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          ignore: DL3008,DL3013  # không ghim phiên bản apt/pip

  docker-smoke:
    name: Docker build & smoke test (CPU)
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: plant-doctor:ci
          cache-from: type=gha,scope=cpu
          cache-to: type=gha,scope=cpu,mode=max

      - name: Import check
        run: |
          docker run --rm plant-doctor:ci python -c \
            "import plant_doctor.knowledge as k, torch, ultralytics, streamlit; \
             print('PlantDoctor ready |', 'torch', torch.__version__)"

      # Không có mô hình -> app vẫn phải khởi động và trả lời health check
      - name: Smoke test (health check)
        run: |
          docker run -d --name app -p 8501:8501 plant-doctor:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8501/_stcore/health; then echo; echo "OK"; exit 0; fi
            sleep 2
          done
          docker logs app
          exit 1

