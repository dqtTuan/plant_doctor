# Ghi đè cho biến thể GPU – cần NVIDIA driver + NVIDIA Container Toolkit.
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
services:
  app:
    image: ${IMAGE:-plant-doctor}:${TAG:-latest}-gpu
    build:
      args:
        TORCH_INDEX_URL: https://download.pytorch.org/whl/cu124
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

