# CD: build & push image lên GitHub Container Registry (ghcr.io).
#   push main      -> :latest, :latest-gpu, :main, :sha-xxxxxxx(-gpu)
#   tag v1.2.3     -> :1.2.3, :1.2, (-gpu) và tạo GitHub Release
# Triển khai: trên máy chủ chạy `docker compose pull && docker compose up -d` (xem README).
name: Release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths-ignore: ["**.md", "notebooks/**"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff pytest
      - run: ruff check .
      - run: pytest -q

  build-push:
    name: Build & push (${{ matrix.variant }})
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cpu
            torch_index: https://download.pytorch.org/whl/cpu
            suffix: ""
          - variant: gpu
            torch_index: https://download.pytorch.org/whl/cu124
            suffix: "-gpu"
    steps:
      # Image GPU (~6 GB) cần thêm dung lượng đĩa trên runner
      - name: Free disk space
        if: matrix.variant == 'gpu'
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          large-packages: false

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
            suffix=${{ matrix.suffix }},onlatest=true
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
          labels: |
            org.opencontainers.image.title=plant-doctor
            org.opencontainers.image.description=Plant Doctor – YOLOv8 + Local RAG (${{ matrix.variant }})

      - name: Build & push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: TORCH_INDEX_URL=${{ matrix.torch_index }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,scope=${{ matrix.variant }},mode=max

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  github-release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build-push
    permissions:
      contents: write
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Docker images
            ```bash
            docker pull ghcr.io/${{ github.repository }}:${{ github.ref_name }}      # CPU
            docker pull ghcr.io/${{ github.repository }}:${{ github.ref_name }}-gpu  # GPU
            ```

