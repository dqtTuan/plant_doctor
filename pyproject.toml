[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plant-doctor"
version = "0.1.0"
description = "Chẩn đoán bệnh lá cây: YOLOv8 + Local RAG (FAISS + Embedding + Qwen2.5 LoRA), 100% offline"
readme = "README.md"
requires-python = ">=3.10"
# torch: dùng bản có sẵn trên Colab; máy local cài theo hướng dẫn tại https://pytorch.org
dependencies = [
    "ultralytics>=8.4.198,<9",
    "transformers>=5.22,<6",
    "peft>=0.21,<1",
    "accelerate>=1.15,<2",
    "datasets>=3.0,<6",
    "sentence-transformers>=6.2,<7",
    "langchain-core>=1.7,<2",
    "langchain-community>=0.4,<0.5",
    "langchain-huggingface>=1.2,<2",
    "langchain-text-splitters>=1.1,<2",
    "faiss-cpu>=1.15,<2",
    "pypdf>=6.21,<7",
    "opencv-python-headless>=5.0,<6",
    "pyyaml>=6,<7",
    "pillow>=11,<13",
    "tqdm>=4.66,<5",
    "streamlit>=1.66,<2",
    "requests>=2.32.4,<3",
    "rank-bm25>=0.2.2,<0.3",
    "beautifulsoup4>=4.12,<5",
    "html2text>=2024,<2026",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5", "ruff>=0.6,<1"]
pg = ["psycopg2-binary>=2.9,<3", "pgvector>=0.3,<1"]

# Lệnh tắt cho từng bước pipeline (tương đương `python -m plant_doctor....`)
[project.scripts]
pd-scrape = "plant_doctor.data.scrape_web:main"
pd-prepare-dataset = "plant_doctor.data.prepare_dataset:main"
pd-train-yolo = "plant_doctor.training.train_yolo:main"
pd-train-embedding = "plant_doctor.training.train_embedding:main"
pd-train-llm = "plant_doctor.training.train_llm:main"
pd-build-index = "plant_doctor.rag.build_index:main"
pd-eval-rag = "plant_doctor.rag.evaluate:main"
pd-download-reranker = "plant_doctor.rag.download_models:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E402", "E501"]
